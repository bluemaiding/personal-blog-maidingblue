<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>纪念长廊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#1a1a2e;color:#f5f5f5}

/* ====== LAYOUT ====== */
.gallery{position:fixed;inset:0;display:flex}

/* ── LEFT: TEXT PANEL ── */
.text-panel{
  position:relative;
  width:28%;
  min-width:260px;
  max-width:420px;
  height:100%;
  z-index:10;
  padding:3rem 2.4rem;
  display:flex;
  flex-direction:column;
  justify-content:center;
  /* frosted glass */
  background:rgba(18,18,30,.7);
  
  
  border-right:1px solid rgba(255,255,255,.08);
  
  transition:opacity .3s ease, transform .3s ease;
}

.panel-label{
  font-size:.68rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,215,170,.6);
  margin-bottom:1.2rem;
  font-weight:500;
}
.panel-title{
  font-family:'Noto Serif SC',serif;
  font-size:2rem;
  font-weight:700;
  color:rgba(255,215,170,.85);
  line-height:1.25;
  margin-bottom:1.4rem;
  letter-spacing:-.01em;
}
.panel-body{
  font-size:.98rem;
  font-weight:300;
  color:rgba(255,235,210,.8);
  line-height:1.85;
  margin-bottom:2rem;
}

/* ── RIGHT: IMAGE AREA ── */
.image-area{
  flex:1;
  position:relative;
  height:100%;
  overflow:hidden;
}

.img-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 1s cubic-bezier(.23,1,.32,1),transform 5s cubic-bezier(.23,1,.32,1);
  will-change:opacity,transform;
}
.img-layer.active{
  opacity:1;
  transform:scale(1.02);
}

/* ====== COUNTER ====== */
.counter{
  position:fixed;
  bottom:2rem;
  left:2.4rem;
  z-index:15;
  display:flex;
  align-items:center;
  gap:.8rem;
  font-size:.8rem;
  color:rgba(255,255,255,.5);
  letter-spacing:.06em;
}
.counter-current{font-size:1.4rem;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.counter-divider{width:32px;height:1px;background:rgba(255,255,255,.15)}
.counter-total{font-size:.82rem;color:rgba(255,255,255,.3)}

/* ====== NAV ARROWS ====== */
.nav-arrow{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  z-index:15;
  width:46px;height:46px;
  border-radius:50%;
  background:rgba(18,20,28,.45);
  -webkit-
  border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.6);
  font-size:1rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s ease;
  user-select:none;
}
.nav-arrow:hover{background:rgba(255,215,170,.12);border-color:rgba(255,215,170,.25);color:#fff}
.nav-arrow:focus{outline:none}
.nav-arrow.prev{display:none!important}
.nav-arrow.next{right:2.5rem}
.nav-arrow.disabled{opacity:.2;pointer-events:none}

/* ====== PROGRESS BAR ====== */
.progress-bar{
  position:fixed;bottom:0;left:0;right:0;
  height:3px;
  background:rgba(255,255,255,.06);
  z-index:15;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,rgba(255,215,170,.5),rgba(255,215,170,.85));
  transition:width .5s cubic-bezier(.23,1,.32,1);
}

/* ====== BACK BUTTON ====== */
.back-btn{
  position:fixed;
  top:1.6rem;left:1.6rem;
  z-index:20;
  width:40px;height:40px;
  border-radius:50%;
  background:rgba(18,20,28,.45);
  -webkit-
  border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);
  font-size:.9rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s ease;
  text-decoration:none;
}
.back-btn:hover{background:rgba(255,215,170,.12);border-color:rgba(255,215,170,.25);color:#fff}
.back-btn:focus{outline:none}

/* ====== TOAST ====== */
.toast{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.92);
  z-index:100;
  padding:1rem 2rem;
  border-radius:12px;
  background:rgba(18,20,28,.75);
  -webkit-
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  font-size:.95rem;
  font-weight:400;
  letter-spacing:.02em;
  pointer-events:none;
  opacity:0;
  transition:opacity .35s ease, transform .35s cubic-bezier(.23,1,.32,1);
}
.toast.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* ====== SCROLL HINT ====== */
.scroll-hint{
  position:fixed;
  bottom:2.5rem;right:2.5rem;
  z-index:15;
  font-size:.7rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:rgba(255,255,255,.28);
  display:flex;align-items:center;gap:.5rem;
  animation:hintPulse 2.5s ease-in-out infinite;
}
.scroll-hint::before{content:'';width:20px;height:1px;background:rgba(255,255,255,.2)}
@keyframes hintPulse{0%,100%{opacity:.28}50%{opacity:.6}}

/* ====== MOBILE ====== */
@media(max-width:768px){
  .gallery{flex-direction:column}
  .text-panel{
    width:100%;
    max-width:none;
    min-width:auto;
    height:auto;
    max-height:40%;
    padding:1.6rem 1.4rem;
    border-right:none;
    border-top:1px solid rgba(255,255,255,.1);
    order:2;
    justify-content:flex-start;
  }
  .panel-label{margin-bottom:.6rem}
  .panel-title{font-size:1.4rem;margin-bottom:.6rem}
  .panel-body{font-size:.82rem;margin-bottom:1rem}
  
  .image-area{width:100%;height:60%;order:1}
  .back-btn{top:auto;bottom:calc(40% + 1rem);left:1.4rem}
  .nav-arrow.prev{left:auto;right:calc(50% + 2rem)}
  .nav-arrow.next{right:calc(50% - 2.5rem)}
  .counter{bottom:calc(40% + .8rem);left:4.2rem}
  .scroll-hint{display:none}
}

@media(hover:none){
  .image-area{cursor:grab}
  .image-area:active{cursor:grabbing}
}
</style>
</head>
<body>

<!-- Gallery -->
<div class="gallery" id="gallery">
  <!-- Text Panel (left) -->
  <div class="text-panel" id="textPanel">
    <div class="panel-label">Memory Gallery</div>
    <div class="panel-title" id="panelTitle">纪念长廊</div>
    <div class="panel-body" id="panelBody">每一张照片都是时光的切片，凝固了那些再也回不去的瞬间。我们走过的路、爱过的人、流过的泪，都在画面中静静沉淀。愿这些纪念，如星光般恒久。</div>
  </div>
  <!-- Image Area (right) -->
  <div class="image-area" id="imageArea"></div>
</div>

<!-- Counter -->
<div class="counter">
  <span class="counter-current" id="counterCurrent">01</span>
  <span class="counter-divider"></span>
  <span class="counter-total" id="counterTotal">06</span>
</div>

<!-- Nav Arrows -->
<button class="nav-arrow prev" id="prevBtn" aria-label="上一张">❮</button>
<button class="nav-arrow next" id="nextBtn" aria-label="下一张">❯</button>

<!-- Progress Bar -->
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<!-- Back Button -->
<a href="index.html" class="back-btn" aria-label="返回首页">←</a>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Scroll Hint -->
<div class="scroll-hint">SCROLL</div>

<script>
(function(){
  const photos = [
    { file: 'memory/1.JPG',   name: '青涩时光',     desc: '小学三年级的合影。还是很想念在惠小分校的时光，放学了在门口周奶奶那里一起买辣条吃的自由自在。' },
    { file: 'memory/2.jpg',   name: '升入初中',     desc: '第一次在解放中学军训的场景。那时江大路校区的操场甚至还是蓝色的，军训也只是跑跑步走走队列。' },
    { file: 'memory/3.png',   name: '决胜中考',     desc: '在八十一中考场完成2022年武汉市中考。六张试卷，结束了我们三年的相知相伴，但故事从未被画上句号。' },
    { file: 'memory/4.png',   name: '毕业留念',     desc: '永远记得解放最好的22届凌云六班，认真负责的老师们，亲切善良的同学们，那段自由而充实的初中生活一直被珍藏在记忆深处。' },
    { file: 'memory/5.JPG',   name: '\u201c铁血\u201d军营', desc: '升入高中，和11班一起赴黄陂郊区军训。学到了第一套军体拳，踢上了第一场球，经受了人生中最烤人的太阳。' },
    { file: 'memory/6.jpg',   name: '漫步江滩',     desc: '2024.12.6结束压力山大的高三期中十一校，在江滩体验了一个惬意的下午。金句梗图的素材大多来自于此活动。' },
    { file: 'memory/7.jpg',   name: '元旦晚会',     desc: '2024.12.31在武汉二中最后一次班级的元旦晚会。全班沉浸在快乐与喜悦的海洋之中，同学们的才华令人叹为观止，剧作家音乐家最佳主演纷纷被发掘。' },
    { file: 'memory/8.jpg',   name: '江滩2.0',      desc: '2025.3.28结束高三下阶段性测试，再次前往江滩徒步。与上一次不同的是大家充分学会了苦中作乐，在大风小雨之中玩得比上次更疯了）' },
    { file: 'memory/9.jpg',   name: '十八成人',     desc: '2025.4.30武汉二中第不知道多少届成人礼。此乃成人礼合影的第一张（没有老师版）' },
    { file: 'memory/10.jpg',  name: '前程似锦',     desc: '此乃成人礼合影的第二张（老师加入版）' },
    { file: 'memory/11.jpg',  name: '决胜高考',     desc: '2025.6.9在武汉六中门口结束高考时所摄。内心OS大抵是终于考完生物了终于考完高考了爽！！！但是高中怎么就这样结束了\u2026\u2026' },
    { file: 'memory/12.jpg',  name: '最好的我们',   desc: '此乃2025.6.5在学校的最后一天的全班合影。时光荏苒，那天的青春也许不能常驻，而我们的13班却将永远璀璨，生生不息。' }
  ];

  const total = photos.length;
  let current = 0;
  let isAnimating = false;

  /* DOM */
  const imageArea = document.getElementById('imageArea');
  const imgA = document.createElement('img');
  const imgB = document.createElement('img');
  imgA.className = 'img-layer active';
  imgB.className = 'img-layer';
  imgA.src = photos[0].file;
  imgB.alt = '';
  imageArea.appendChild(imgA);
  imageArea.appendChild(imgB);

  const counterCurrent = document.getElementById('counterCurrent');
  const counterTotal = document.getElementById('counterTotal');
  const progressFill = document.getElementById('progressFill');
  const nextBtn = document.getElementById('nextBtn');
  const panelTitle = document.getElementById('panelTitle');
  const panelBody = document.getElementById('panelBody');

  function refreshUI(){
    progressFill.style.width = ((current + 1) / total * 100) + '%';
    counterCurrent.textContent = String(current + 1).padStart(2, '0');
    panelTitle.textContent = photos[current].name;
    panelBody.textContent = photos[current].desc;
  }

  counterTotal.textContent = String(total).padStart(2, '0');
  refreshUI();

  /* SWITCH */
  function goTo(index){
    if(isAnimating || index === current || index < 0 || index >= total) return;
    isAnimating = true;

    const activeEl = imgA.classList.contains('active') ? imgA : imgB;
    const passiveEl = (activeEl === imgA) ? imgB : imgA;

    const tmp = new Image();
    tmp.onload = function(){
      passiveEl.src = photos[index].file;
      requestAnimationFrame(function(){
        activeEl.classList.remove('active');
        passiveEl.classList.add('active');
        current = index;
        refreshUI();
        setTimeout(function(){ isAnimating = false; }, 400);
      });
    };
    tmp.onerror = function(){
      passiveEl.src = photos[index].file;
      activeEl.classList.remove('active');
      passiveEl.classList.add('active');
      current = index;
      refreshUI();
      isAnimating = false;
    };
    tmp.src = photos[index].file;
  }

  function goNext(){ if(current < total - 1) goTo(current + 1); }
  function goPrev(){ if(current > 0) goTo(current - 1); }

  /* EVENTS */
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown') goNext();
    if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') goPrev();
  });

  var wheelLock = false;
  window.addEventListener('wheel', function(e){
    if(wheelLock || Math.abs(e.deltaY) < 15) return;
    wheelLock = true;
    e.deltaY > 0 ? goNext() : goPrev();
    setTimeout(function(){ wheelLock = false; }, 300);
  }, { passive: true });

  var touchStartY = 0;
  window.addEventListener('touchstart', function(e){
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', function(e){
    var dy = touchStartY - e.changedTouches[0].clientY;
    if(Math.abs(dy) > 30){ dy > 0 ? goNext() : goPrev(); }
  }, { passive: true });
})();
</script>
</body>
</html>
